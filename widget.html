<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spielplan Widget</title>
  <style>
    :root { --accent: #ff4500; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: transparent; color: #f0f0f0; padding: 20px; }
    .widget-wrapper { max-width: 900px; margin: 0 auto; }
    .team-block { margin-bottom: 48px; }
    .team-title {
      font-size: 1.6rem; font-weight: 800; color: var(--accent);
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 24px; padding-bottom: 8px; border-bottom: 2px solid var(--accent);
    }
    .team-title:empty { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .section-title {
      font-size: 0.85rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 3px; color: #888; margin: 24px 0 12px 0;
    }
    .live-banner {
      background: #ff0000; color: #fff; border-radius: 8px;
      padding: 16px 20px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .live-banner .live-badge {
      background: #fff; color: #ff0000; font-weight: 900;
      font-size: 0.7rem; letter-spacing: 2px; padding: 3px 8px;
      border-radius: 4px; animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .live-banner .live-info { flex: 1; font-size: 1rem; font-weight: 600; }
    .live-banner .live-score { font-size: 1.4rem; font-weight: 900; }
    .live-banner a {
      background: #fff; color: #ff0000; text-decoration: none;
      font-weight: 700; font-size: 0.8rem; padding: 8px 14px;
      border-radius: 6px; white-space: nowrap;
    }
    .gameday-card {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 10px; margin-bottom: 16px; overflow: hidden;
    }
    .gameday-header {
      background: #222; padding: 12px 18px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; border-bottom: 1px solid #333;
    }
    .gameday-header .gd-name { font-weight: 700; font-size: 1rem; color: #fff; }
    .gameday-header .gd-meta { font-size: 0.75rem; color: #888; display: flex; gap: 12px; }
    .gameday-header .gd-league {
      background: #333; color: #ccc; padding: 2px 8px;
      border-radius: 4px; font-size: 0.7rem; font-weight: 600;
    }
    .game-row { border-bottom: 1px solid #222; }
    .game-row:last-child { border-bottom: none; }
    .game-row-main {
      padding: 14px 18px; display: grid;
      grid-template-columns: 1fr auto 1fr; align-items: center;
      gap: 12px;
    }
    .game-row.has-detail .game-row-main { cursor: pointer; }
    .game-row.has-detail .game-row-main:hover { background: rgba(255,255,255,0.04); border-radius: 4px; }
    .game-row .team-home { display:flex; align-items:center; justify-content:flex-end; gap:6px; font-weight: 600; font-size: 0.95rem; }
    .game-row .team-away { display:flex; align-items:center; justify-content:flex-start; gap:6px; font-weight: 600; font-size: 0.95rem; }
    .game-row-logo { width:20px; height:20px; object-fit:contain; border-radius:2px; flex-shrink:0; }
    .team-home.highlight, .team-away.highlight { color: var(--accent); }
    .game-row .score-box { text-align: center; min-width: 90px; }
    .game-detail { padding: 10px 18px 14px; border-top: 1px solid #1c1c1c; }
    .detail-halves { display: flex; gap: 40px; margin-bottom: 12px; }
    .game-detail .half { display: flex; flex-direction: column; gap: 3px; }
    .game-detail .half-label { font-size: 0.65rem; color: #555; text-transform: uppercase; letter-spacing: 1px; }
    .game-detail .half-score { font-size: 0.9rem; font-weight: 700; color: #ccc; }
    .game-log { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 4px; }
    .game-log th { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: #555; padding: 4px 6px; border-bottom: 1px solid #222; }
    .game-log th:first-child { text-align: right; }
    .game-log th:last-child  { text-align: left; }
    .game-log th:nth-child(2) { text-align: center; min-width: 52px; }
    .game-log td { padding: 2px 6px; color: #888; vertical-align: middle; }
    .game-log .log-l { text-align: right; }
    .game-log .log-s { text-align: center; font-weight: 700; color: #ccc; font-size: 0.82rem; white-space: nowrap; }
    .game-log .log-r { text-align: left; }
    .game-log .log-marker td { text-align: center; color: #444; font-style: italic; padding: 5px 0; }
    .game-log s { color: #555; }
    .standings-wrapper { max-width: 900px; margin: 0 auto; }
    .standings-league-title {
      font-size: 0.85rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 3px; color: #888; margin: 24px 0 12px 0;
    }
    .standings-table { width: 100%; border-collapse: collapse; }
    .standings-table th {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px;
      color: #555; padding: 8px 6px; border-bottom: 1px solid #333; text-align: right;
    }
    .standings-table th.col-team { text-align: left; }
    .standings-table th.col-rank { text-align: right; width: 2em; }
    .standings-table td {
      padding: 8px 6px; border-bottom: 1px solid #1c1c1c;
      font-size: 0.85rem; text-align: right; color: #ccc;
    }
    .standings-table td.col-team { text-align: left; font-weight: 600; color: #f0f0f0; }
    .standings-table td.col-rank { color: #555; font-size: 0.75rem; }
    .standings-row-highlight td { color: var(--accent); font-weight: 700; }
    .standings-row-restricted td { opacity: 0.55; }
    .standings-empty { color: #555; font-size: 0.85rem; padding: 16px 0; }
    .team-logo { width: 24px; height: 24px; object-fit: contain; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
    .year-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .year-tab {
      background: #222; color: #888; border: 1px solid #333;
      border-radius: 6px; padding: 6px 16px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; letter-spacing: 1px;
    }
    .year-tab:hover { border-color: #555; color: #ccc; }
    .year-tab.year-tab-active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .standings-year-content { /* intentionally empty — structural wrapper only */ }
    .score-box .time { font-size: 0.75rem; color: #888; }
    .score-box .score { font-size: 1.2rem; font-weight: 900; color: #fff; }
    .score-box .score.win  { color: #4caf50; }
    .score-box .score.loss { color: #f44336; }
    .score-box .score.draw { color: #ff9800; }
    .score-box .stage-label { font-size: 0.65rem; color: #666; text-transform: uppercase; letter-spacing: 1px; }
    .score-box .upcoming-time { font-size: 0.85rem; font-weight: 700; color: #aaa; }
    .no-data { color: #555; font-style: italic; font-size: 0.9rem; padding: 16px 0; }
    .loading  { color: #555; font-size: 0.85rem; padding: 20px 0; text-align: center; }
    .error-banner {
      background: #2a1010; border: 1px solid #5a2020;
      border-radius: 8px; padding: 12px 16px;
      color: #f44336; font-size: 0.85rem; margin-bottom: 12px;
    }
    @media (max-width: 600px) {
      .game-row-main { gap: 6px; padding: 12px; }
      .game-detail { padding: 8px 12px 12px; }
      .detail-halves { gap: 24px; }
      .game-row .team-home, .game-row .team-away { font-size: 0.8rem; }
      .score-box .score { font-size: 1rem; }
      .game-row-logo { display: none; }
    }
    .load-more { display:block; width:100%; margin:6px 0 0; padding:6px 0;
      background:none; border:1px solid var(--accent); border-radius:4px;
      color:var(--accent); font-size:0.85rem; cursor:pointer; }
    .load-more:hover { background:rgba(var(--accent-rgb,255,69,0),0.08); }
    .toggle-more-future { display:block; width:100%; margin:0 0 6px; padding:6px 0;
      background:none; border:1px solid #444; border-radius:4px;
      color:#888; font-size:0.85rem; cursor:pointer; }
    .toggle-more-future:hover { background:#1e1e1e; color:#aaa; }
    body.compact { padding: 12px; }
    body.compact .team-block { margin-bottom: 28px; }
    body.compact .gameday-card { margin-bottom: 10px; }
    body.compact .gameday-header { padding: 8px 14px; }
    body.compact .game-row-main { padding: 10px 14px; }
    body.compact .game-row .team-home, body.compact .game-row .team-away { font-size: 0.85rem; }
    body.compact .score-box .score { font-size: 1rem; }
    /* ── LIVE TICKER ─────────────────────────────────────────────────────────────── */
    .live-ticker-game { margin-bottom: 24px; }
    .lt-header {
      background: #1c1c1c; padding: 10px 18px; border-bottom: 1px solid #2a2a2a;
      display: flex; align-items: center; gap: 8px;
    }
    .lt-live-badge {
      background: #f44336; color: #fff; font-size: 0.65rem; font-weight: 900;
      letter-spacing: 1.5px; padding: 2px 6px; border-radius: 3px; animation: blink 1s infinite;
    }
    .lt-status  { font-size: 0.7rem; color: #888; margin-left: auto; }
    .lt-scorebar {
      background: #181818; padding: 10px 18px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #222;
    }
    .lt-team { font-size: 0.8rem; font-weight: 700; color: #ccc; }
    .lt-team.lt-ours { color: var(--accent); }
    .lt-score-center { text-align: center; }
    .lt-score-val { font-size: 1.3rem; font-weight: 900; color: #fff; }
    .lt-score-meta { font-size: 0.65rem; color: #888; margin-top: 2px; }
    .lt-possession { font-size: 0.65rem; color: #ff9800; margin-top: 1px; }
    .lt-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    .lt-table td { padding: 3px 10px; border-bottom: 1px solid #1a1a1a; vertical-align: top; }
    .lt-col-home { width: 44%; text-align: right; color: #aaa; }
    .lt-col-mid  { width: 12%; text-align: center; font-weight: 700; font-size: 0.7rem; color: #555; vertical-align: middle; white-space: nowrap; }
    .lt-col-away { width: 44%; text-align: left; color: #aaa; }
    .lt-team-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 1px; }
    .lt-col-home .lt-team-label { color: var(--accent); }
    .lt-col-away .lt-team-label { color: #6495ed; }
    .lt-scoring td { background: rgba(255,69,0,0.06); }
    .lt-scoring .lt-col-home, .lt-scoring .lt-col-away { color: #f0f0f0; }
    .lt-scoring .lt-col-mid { color: #fff; }
    .lt-neutral td { text-align: center !important; color: #444; font-style: italic; padding: 5px 8px; }
    .lt-conn-error {
      background: #2a1a10; border: 1px solid #5a3010; border-radius: 6px;
      padding: 8px 14px; color: #ff9800; font-size: 0.8rem; margin-bottom: 10px;
    }
    @keyframes lt-flash { 0% { background: rgba(255,69,0,0.25); } 100% { background: transparent; } }
    .lt-flash { animation: lt-flash 0.8s ease-out; }
    /* live-banner as clickable link */
    a.live-banner {
      display: flex;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    a.live-banner:hover {
      background: rgba(255, 69, 0, 0.08);
      box-shadow: inset 3px 0 0 var(--accent);
      transition: background 0.15s;
    }
  </style>
</head>
<body>

<script>

// ── CONSTANTS ────────────────────────────────────────────────────────────────
var API_BASE          = 'https://leaguesphere.app/api';

var CACHE_VERSION     = 3;
var LIVETICKER_API    = API_BASE + '/liveticker/';
var _pastCache        = {};

var _liveGames        = {};         // gameId → gameState (see spec)

var _liveSnap         = null;       // snapshot stored by renderLiveView for polling use

// ── URL PARAMS ───────────────────────────────────────────────────────────────
function parseConfigFromSearch(search) {
  var params      = new URLSearchParams(search);
  var teams       = params.getAll('t').map(Number).filter(function(n) { return Number.isInteger(n) && n > 0; });
  var color       = (params.get('color') || 'ff4500').replace(/^#/, '');
  var refresh     = params.has('refresh');
  var past        = Math.max(1, parseInt(params.get('past'),   10) || 3);
  var future      = Math.max(0, parseInt(params.get('future'), 10) || 0);  // 0 = all
  var showPast    = params.get('show_past')   !== '0';
  var showFuture  = params.get('show_future') !== '0';
  var showTitle   = params.get('title')       !== '0';
  var compact     = params.get('compact')     === '1';
  var view        = params.get('view') || 'spielplan';
  var liveUrl     = params.get('live_url') || '';
  if (liveUrl && !/^https?:\/\//.test(liveUrl)) liveUrl = '';
  return { teams: teams, color: color, refresh: refresh, past: past, future: future,
           showPast: showPast, showFuture: showFuture, showTitle: showTitle, compact: compact,
           view: view, liveUrl: liveUrl };
}
function parseConfig() { return parseConfigFromSearch(window.location.search); }

// ── SECURITY ─────────────────────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fingerprintGames(games) {
  return (games || []).map(function(g) {
    return g.id + ':' + g.status + ':' + (g.final_score || '') + ':' + (g.halftime_score || '');
  }).sort().join('|');
}

// ── UTILS ────────────────────────────────────────────────────────────────────
function formatDate(dateStr) {
  var d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('de-DE', { weekday:'short', day:'2-digit', month:'2-digit', year:'numeric' });
}

function getTickPoints(text) {
  if (text.startsWith('Touchdown'))      return 6;
  if (text.startsWith('2-Extra-Punkte')) return /: -$/.test(text) ? 0 : 2;
  if (text.startsWith('1-Extra-Punkt'))  return /: -$/.test(text) ? 0 : 1;
  return 0;
}

function buildTickRows(gs) {
  var ourName = gs.watchedSide === 'home' ? gs.homeName : gs.awayName;
  var oppName = gs.watchedSide === 'home' ? gs.awayName : gs.homeName;
  var runScore = { home: 0, away: 0 };
  return (gs.ticks || []).map(function(tick) {
    if (tick.team == null) {
      return '<tr class="lt-neutral"><td colspan="3">' + escapeHtml(tick.text) + '</td></tr>';
    }
    var pts = getTickPoints(tick.text);
    if (pts > 0 && tick.team) runScore[tick.team] += pts;
    var isOurSide = tick.team === gs.watchedSide;
    var isScoring = pts > 0;
    var rowClass  = isScoring ? ' class="lt-scoring"' : '';
    var ourScore  = gs.watchedSide === 'home' ? runScore.home : runScore.away;
    var oppScore  = gs.watchedSide === 'home' ? runScore.away : runScore.home;
    var scoreCell = (isScoring && gs.hasFullHistory) ? escapeHtml(ourScore + ':' + oppScore) : '';
    var label     = isScoring
      ? '<span class="lt-team-label">' + escapeHtml(isOurSide ? ourName : oppName) + '</span>'
      : '';
    var evText = label + escapeHtml(tick.text);
    if (isOurSide) {
      return '<tr' + rowClass + '>'
        + '<td class="lt-col-home">' + evText + '</td>'
        + '<td class="lt-col-mid">' + scoreCell + '</td>'
        + '<td class="lt-col-away"></td>'
        + '</tr>';
    } else {
      return '<tr' + rowClass + '>'
        + '<td class="lt-col-home"></td>'
        + '<td class="lt-col-mid">' + scoreCell + '</td>'
        + '<td class="lt-col-away">' + evText + '</td>'
        + '</tr>';
    }
  }).reverse().join('');
}

function getResultClass(teamId, results) {
  var me    = results.find(function(r) { return r.team_id === teamId; });
  var other = results.find(function(r) { return r.team_id !== teamId; });
  if (!me || !other || me.pa == null || other.pa == null) return '';
  if (me.pa < other.pa) return 'win';   // pa = points against; fewer points against = win
  if (me.pa > other.pa) return 'loss';
  return 'draw';
}

var _teamNameByAbbrev = {};
function resolveTeamName(abbrev) { return _teamNameByAbbrev[abbrev] || abbrev; }

var _openDetail = null;
function _toggleGameDetail(mainEl) {
  var detail = mainEl.parentElement.querySelector('.game-detail');
  if (!detail) return;
  var isOpen = _openDetail === detail;
  if (_openDetail) { _openDetail.hidden = true; _openDetail = null; }
  if (!isOpen) { detail.hidden = false; _openDetail = detail; }
}

function splitTodayGames(games, teamId) {
  var forTeam = games.filter(function(g) {
    return g.results.some(function(r) { return r.team_id === teamId; });
  });
  return {
    live:     forTeam.filter(function(g) { return g.status === 'live'; }),
    finished: forTeam.filter(function(g) { return g.status === 'beendet'; }),
    upcoming: forTeam.filter(function(g) { return g.status !== 'live' && g.status !== 'beendet'; }),
  };
}

// ── CACHE ────────────────────────────────────────────────────────────────────
function cacheKey(teamId) { return 'lsw_' + teamId; }

function loadCache(teamId, storage) {
  var store = storage || localStorage;
  try {
    var raw = store.getItem(cacheKey(teamId));
    if (!raw) return null;
    var cache = JSON.parse(raw);
    if (cache.version !== CACHE_VERSION) return null;
    return cache;
  } catch(e) { return null; }
}

function saveCache(teamId, data, storage) {
  var store = storage || localStorage;
  try {
    store.setItem(cacheKey(teamId), JSON.stringify(Object.assign({}, data, { version: CACHE_VERSION })));
    return true;
  } catch(e) { return false; }
}

function clearCache(teamId, storage) {
  var store = storage || localStorage;
  try { store.removeItem(cacheKey(teamId)); } catch(e) {}
}

function needsDiscovery(cache) {
  if (!cache || !cache.next_discovery) return true;
  return new Date(cache.next_discovery) <= new Date();
}

// ── CONCURRENCY ──────────────────────────────────────────────────────────────
async function batchedAll(items, asyncFn, batchSize, onBatchDone) {
  var results = [];
  for (var i = 0; i < items.length; i += batchSize) {
    var batch       = items.slice(i, i + batchSize);
    var batchResult = await Promise.all(batch.map(asyncFn));
    results.push.apply(results, batchResult);
    if (onBatchDone) onBatchDone(results.length, items.length);
  }
  return results;
}

// ── CLASSIFICATION ───────────────────────────────────────────────────────────
function classifyGameday(gd, games, teamId, today) {
  var t = today || new Date().toISOString().slice(0, 10);
  var teamGames = games.filter(function(g) {
    return g.results.some(function(r) { return r.team_id === teamId; });
  });
  if (teamGames.length === 0) return null;
  if (gd.date < t) return 'past';
  var allDone = teamGames.every(function(g) { return g.status === 'beendet'; });
  if (allDone) return 'past';
  return 'active';
}

// ── API ──────────────────────────────────────────────────────────────────────
async function fetchJSON(url) {
  var res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status + ' - ' + url);
  return res.json();
}

// ── SNAPSHOT ─────────────────────────────────────────────────────────────────
var _snapshotPromise = null;
async function loadSnapshot() {
  if (!_snapshotPromise) {
    var base = window.location.href.replace(/[^/]*$/, '');
    _snapshotPromise = fetchJSON(base + 'snapshot.json').then(function(snap) {
      snap.teams.forEach(function(t) { _teamNameByAbbrev[t.abbrev] = t.name; });
      return snap;
    });
  }
  return _snapshotPromise;
}

var _newGamedaysPromise = null;
async function fetchNewGamedays() {
  if (!_newGamedaysPromise) {
    _newGamedaysPromise = loadSnapshot().then(function(snap) {
      var maxId = Math.max.apply(null, snap.gamedays.map(function(gd) { return gd.id; }));
      return fetchJSON(API_BASE + '/gamedays/?format=json&page_size=100').then(function(d) {
        return d.results
          .filter(function(gd) { return gd.id > maxId; })
          .map(function(gd) {
            return {
              id:             gd.id,
              date:           gd.date,
              name:           gd.name           || '',
              start:          gd.start          || '',
              league_display: gd.league_display || '',
              address:        gd.address        || '',
            };
          });
      });
    });
  }
  return _newGamedaysPromise;
}

async function fetchGames(gamedayId) {
  return fetchJSON(API_BASE + '/gamedays/' + gamedayId + '/games/?format=json');
}

async function fetchGamedayDetail(gamedayId) {
  return fetchJSON(API_BASE + '/gamedays/' + gamedayId + '/?format=json');
}

// ── DISCOVERY ────────────────────────────────────────────────────────────────
async function discoverNewGamedays(teamId, knownIds, onProgress) {
  var snap        = await loadSnapshot();
  var newGds      = await fetchNewGamedays();
  var allGamedays = snap.gamedays.concat(newGds);
  var newGamedays = allGamedays.filter(function(gd) { return !knownIds.has(gd.id); });
  if (newGamedays.length === 0) return [];

  // Snapshot gamedays carry their games — use directly; truly new gamedays fetch from API
  var fromSnapshot = newGamedays.filter(function(gd) { return gd.games; });
  var needFetch    = newGamedays.filter(function(gd) { return !gd.games; });

  var snapshotEntries = fromSnapshot
    .map(function(gd) { return { gd: gd, games: gd.games }; })
    .filter(function(e) {
      return e.games.some(function(g) {
        return g.results.some(function(r) { return r.team_id === teamId; });
      });
    });

  if (needFetch.length === 0) {
    if (onProgress) onProgress(snapshotEntries.length, snapshotEntries.length);
    return snapshotEntries;
  }

  var fetched = await batchedAll(needFetch, async function(gd) {
    try {
      var games = await fetchGames(gd.id);
      return { gd: gd, games: games };
    } catch(e) { return null; }
  }, BATCH_SIZE, function(done, total) {
    if (onProgress) onProgress(snapshotEntries.length + done, snapshotEntries.length + total);
  });

  return snapshotEntries.concat(
    fetched
      .filter(function(e) { return e !== null; })
      .filter(function(e) {
        return e.games.some(function(g) {
          return g.results.some(function(r) { return r.team_id === teamId; });
        });
      })
  );
}

  results.forEach(function(r) {

    if (full === log.l || r.team_name === log.l) leftIsHome = r.isHome;
  });

  var rows = log.ev.map(function(ev) {
    if (ev.b) return '<tr class="log-marker"><td colspan="3">' + escapeHtml(ev.b) + '</td></tr>';
    var lHtml = ev.l ? (ev.lx ? '<s>' + escapeHtml(ev.l) + '</s>' : escapeHtml(ev.l)) : '';
    var rHtml = ev.r ? (ev.rx ? '<s>' + escapeHtml(ev.r) + '</s>' : escapeHtml(ev.r)) : '';
    return '<tr><td class="log-l">' + lHtml + '</td><td class="log-s">' + escapeHtml(ev.s || '') + '</td><td class="log-r">' + rHtml + '</td></tr>';

    + '<thead><tr><th>' + escapeHtml(log.l) + '</th><th>Stand</th><th>' + escapeHtml(log.r) + '</th></tr></thead>'

  var awayHL   = away.team_id === teamId ? ' highlight' : '';

    if (!fs) {

      halvesHTML = '<div class="detail-halves">'

  return '<div class="game-row' + rowClass + '">'
    + '<div class="game-row-main"' + clickAttr + '>'
    +   '<div class="team-home' + homeHL + '"><span>' + homeName + '</span>' + homeLogo + '</div>'
    +   '<div class="score-box">'
    +     '<div class="time">' + time + ' Uhr · Feld ' + field + '</div>'
    +     scoreHTML
    +     '<div class="stage-label">' + stage + standing + '</div>'
    +   '</div>'
    +   '<div class="team-away' + awayHL + '">' + awayLogo + '<span>' + awayName + '</span></div>'
    + '</div>'
    + detailHTML
    + '</div>';

function renderGamedayCard(gd, games, teamId, showScore) {
  var teamGames = games.filter(function(g) {
    return g.results.some(function(r) { return r.team_id === teamId; });
  });
  if (teamGames.length === 0) return '';

  var rows   = teamGames.slice().sort(function(a,b) {
    return (b.scheduled || '').localeCompare(a.scheduled || '');
  }).map(function(g) { return renderGameRow(g, teamId, showScore); }).join('');
  var name   = escapeHtml(gd.name);
  var date   = escapeHtml(formatDate(gd.date));
  var start  = escapeHtml(gd.start);
  var league = escapeHtml(gd.league_display || '');
  var addrRaw = (gd.address || '').trim();
  var skipAddr = !addrRaw || ['tba','tbd','adresse folgt'].some(function(s) { return addrRaw.toLowerCase().startsWith(s); });
  var addr   = skipAddr ? '' : '<span>' + escapeHtml(addrRaw.split(',')[0]) + '</span>';

  return '<div class="gameday-card">'
    + '<div class="gameday-header">'
    +   '<div><div class="gd-name">' + name + '</div>'
    +   '<div class="gd-meta"><span>' + date + '</span><span>' + start + ' Uhr</span>' + addr + '</div></div>'
    +   '<div class="gd-league">' + league + '</div>'
    + '</div>'
    + rows
    + '</div>';
}



function resolveTeamAbbrev(teamId, entries) {
  for (var i = 0; i < entries.length; i++) {
    var games = entries[i].games;
    for (var j = 0; j < games.length; j++) {
      var r = games[j].results.find(function(result) { return result.team_id === teamId; });
      if (r) return r.team_name;
    }
  }
  return String(teamId);
}

// ── DATA STORE ───────────────────────────────────────────────────────────────
var DataStore = (function() {
  var _snap        = null;
  var _liveScores  = {};          // gameId → { home: N, away: N }
  var _ticks       = {};          // gameId → Tick[] oldest-first
  var _fpSets      = {};          // gameId → Set of fingerprints (dedup)
  var _mode        = 'watching';  // 'watching' | 'live'
  var _int         = null;
  var _subs        = {};
  var _watchedIds  = new Set();
  var WATCH_MS     = 30 * 60 * 1000;
  var LIVE_MS      = 5 * 1000;

  function subscribe(ev, fn) {
    if (!_subs[ev]) _subs[ev] = [];
    _subs[ev].push(fn);
  }

  function emit(ev, data) {
    (_subs[ev] || []).forEach(function(fn) { fn(data); });
  }

  function _deriveScore(ticks) {
    var score = new Object(); score.home = 0; score.away = 0;
    (ticks || []).forEach(function(tick) {
      if (tick.team == null) return;
      var pts = getTickPoints(tick.text || '');
      if (pts > 0) score[tick.team] += pts;
    });
    return score;
  }

  async function init(cfg) {
    _snap = await loadSnapshot();
    var today = new Date().toISOString().slice(0, 10);
    _watchedIds = new Set();
    _snap.gamedays.forEach(function(gd) {
      if (gd.date !== today) return;
      (gd.games || []).forEach(function(g) {
        var watched = cfg.teams.some(function(tid) {
          return g.results.some(function(r) { return r.team_id === tid; });
        });
        if (watched) _watchedIds.add(g.id);
      });
    });
    emit('snapshot-loaded', _snap);
    _int = setInterval(function() { _pollNow(); }, WATCH_MS);
  }

  function _pollNow() {
    fetchJSON(LIVETICKER_API).then(function(data) {
      var liveForUs = (data || []).filter(function(g) { return _watchedIds.has(g.gameId); });
      _pollWith(_snap, _watchedIds, liveForUs);
    }).catch(function() {});
  }

  function _pollWith(snap, watchedIds, liveForUs) {
    if (!liveForUs || liveForUs.length === 0) return;

    if (_mode === 'watching') {
      _mode = 'live';
      clearInterval(_int);
      _int = setInterval(function() { _pollNow(); }, LIVE_MS);
    }

    liveForUs.forEach(function(game) {
      var gameId   = game.gameId;
      var known    = _ticks[gameId] || [];
      var fps      = _fpSets[gameId] || new Set();
      var prevLen  = known.length;

      // Merge ticks (API order may be newest-first; dedup by fingerprint)
      var incoming = game.ticks || [];
      incoming.slice().reverse().forEach(function(tick) {
        var fp = (tick.text || '') + '|' + (tick.time || '');
        if (!fps.has(fp)) { fps.add(fp); known.push(tick); }
      });
      _ticks[gameId]  = known;
      _fpSets[gameId] = fps;

      // Derive score and emit if changed
      var score    = _deriveScore(known);
      var prev     = _liveScores[gameId];
      var changed  = !prev || prev.home !== score.home || prev.away !== score.away;
      _liveScores[gameId] = score;

      if (changed) {
        var snapGame = null;
        (snap.gamedays || []).forEach(function(gd) {
          (gd.games || []).forEach(function(g) { if (g.id === gameId) snapGame = g; });
        });
        var homeRes = snapGame && snapGame.results.find(function(r) { return r.isHome; });
        var awayRes = snapGame && snapGame.results.find(function(r) { return !r.isHome; });
        emit('game-score-update', {
          gameId:    gameId,
          homeScore: score.home,
          awayScore: score.away,
          homeName:  homeRes ? homeRes.team_name : '',
          awayName:  awayRes ? awayRes.team_name : '',
        });
      }

      // Emit new ticks
      var newTicks = known.slice(prevLen);
      if (newTicks.length > 0) {
        emit('ticks-update', { gameId: gameId, newTicks: newTicks });

        // Check for game over
        var over = newTicks.some(function(t) {
          return t.team == null && t.text === 'Spiel beendet';
        });
        if (over) {
          emit('game-finished', { gameId: gameId });
          delete _ticks[gameId];
          delete _fpSets[gameId];
          delete _liveScores[gameId];
          watchedIds.delete(gameId);

          if (Object.keys(_ticks).length === 0 && _mode === 'live') {
            _mode = 'watching';
            clearInterval(_int);
            _int = setInterval(function() { _pollNow(); }, WATCH_MS);
          }
        }
      }
    });
  }

  return {
    get snapshot()    { return _snap; },
    get liveScores()  { return _liveScores; },
    get ticks()       { return _ticks; },
    get _mode()       { return _mode; },
    subscribe:        subscribe,
    emit:             emit,
    _deriveScore:     _deriveScore,
    _pollWith:        _pollWith,
    init:             init,
  };
})();

// ── SNAPSHOT QUICK-RENDER ───────────────────────────────────────────────────
function quickRenderFromSnap(snap, teamId, els, cfg, today) {
  var forTeam = snap.gamedays.filter(function(gd) {
    return gd.games && gd.games.some(function(g) {
      return g.results.some(function(r) { return r.team_id === teamId; });
    });
  });
  var past = forTeam
    .filter(function(gd) { return classifyGameday(gd, gd.games, teamId, today) === 'past'; })
    .sort(function(a, b) { return b.date.localeCompare(a.date); });
  var active = forTeam
    .filter(function(gd) { return classifyGameday(gd, gd.games, teamId, today) === 'active'; })
    .sort(function(a, b) { return a.date.localeCompare(b.date); });

  if (els.past && past.length) {
    var pastWrapped = past.map(function(gd) { return { gd: gd, games: gd.games }; });
    _pastCache[teamId] = pastWrapped;
    els.past.innerHTML = renderPastSection(pastWrapped, teamId, cfg.past);
  }
  if (els.future) {
    var sf = cfg.future > 0 ? active.slice(0, cfg.future) : active;
    var normalized = sf.map(function(gd) { return { gd: gd, games: gd.games }; });
    _futureCache[teamId] = normalized;
    els.future.innerHTML = renderFutureSection(normalized, teamId, 0);
  }
}
function quickRenderFutureFromSnap(snap, teamId, els, cfg, today) {
  if (!els.future) return;
  var active = snap.gamedays.filter(function(gd) {
    return gd.games && gd.games.some(function(g) {
      return g.results.some(function(r) { return r.team_id === teamId; });
    }) && classifyGameday(gd, gd.games, teamId, today) === 'active';
  }).sort(function(a, b) { return a.date.localeCompare(b.date); });
  var sf = cfg.future > 0 ? active.slice(0, cfg.future) : active;
  var normalized = sf.map(function(gd) { return { gd: gd, games: gd.games }; });
  _futureCache[teamId] = normalized;
  els.future.innerHTML = renderFutureSection(normalized, teamId, 0);
}
// ── LOAD TEAM ────────────────────────────────────────────────────────────────
async function loadTeam(teamId, els, cfg) {
  var today = new Date().toISOString().slice(0, 10);
  var snap  = await loadSnapshot();
  var snapTeam = snap.teams.find(function(t) { return t.id === teamId; });
  if (els.title && snapTeam) els.title.textContent = snapTeam.name;
  var cache = loadCache(teamId);

  // Phase 1: Instant render — always show future from snapshot immediately;
  //           use cache for past if available, otherwise fall back to snapshot
  if (cache && cache.past && cache.past.length) {
    if (els.past) {
      var sorted = cache.past.slice().sort(function(a,b) { return b.gd.date.localeCompare(a.gd.date); });
      els.past.innerHTML = sorted.map(function(e) { return renderGamedayCard(e.gd, e.games, teamId, true); }).join('');
    }
  } else {
    quickRenderFromSnap(snap, teamId, els, cfg, today);
  }
  // Always pre-fill future from snapshot so it shows instantly (Phase 4 will update silently if changed)
  quickRenderFutureFromSnap(snap, teamId, els, cfg, today);
  var futureRenderedInPhase1 = true;

  // Phase 2: Discover new gamedays (updates display when done)
  if (needsDiscovery(cache)) {
    var knownIds = new Set(
      (cache && cache.past ? cache.past.map(function(p) { return p.id; }) : [])
      .concat(cache && cache.active_ids ? cache.active_ids : [])
    );

    var newEntries = await discoverNewGamedays(teamId, knownIds);

    if (!cache) cache = { past: [], active_ids: [] };

    newEntries.forEach(function(e) {
      var cls = classifyGameday(e.gd, e.games, teamId, today);
      if (cls === 'past' && !cache.past.some(function(p) { return p.id === e.gd.id; })) {
        cache.past.push({ id: e.gd.id, gd: e.gd, games: e.games });
      } else if (cls === 'active' && cache.active_ids.indexOf(e.gd.id) === -1) {
        cache.active_ids.push(e.gd.id);
      }
    });

    cache.next_discovery = new Date(Date.now() + DISCOVERY_TTL_MS).toISOString();
    cache.scanned_at     = new Date().toISOString();
  }

  // Always re-fetch active gamedays for current scores/status
  var activeEntries = (await Promise.all(
    (cache.active_ids || []).map(async function(id) {
      try {
        var results = await Promise.all([fetchGamedayDetail(id), fetchGames(id)]);
        var gd    = results[0];
        var games = results[1];
        gd.league_display = gd.league_display || '';
        return { id: id, gd: gd, games: games };
      } catch(e) { return null; }
    })
  )).filter(Boolean);

  // Promote completed active gamedays to permanent past cache
  var newActiveIds = [];
  var pastChanged = false;
  activeEntries.forEach(function(e) {
    var cls = classifyGameday(e.gd, e.games, teamId, today);
    if (cls === 'past') {
      if (!cache.past.some(function(p) { return p.id === e.id; })) {
        cache.past.push({ id: e.id, gd: e.gd, games: e.games });
        pastChanged = true;
      }
    } else {
      newActiveIds.push(e.id);
    }
  });
  cache.active_ids = newActiveIds;
  saveCache(teamId, cache);

  // Resolve display name from first matching game result
  var allEntries = cache.past.concat(activeEntries);
  var abbrev      = resolveTeamAbbrev(teamId, allEntries);
  if (els.title) els.title.textContent = resolveTeamName(abbrev);

  // Live section — only from today's active entries (not future gamedays)
  var liveItems = [];
  activeEntries.forEach(function(e) {
    if (e.gd.date !== today) return;
    e.games.forEach(function(g) {
      if (g.status === 'live' && g.results.some(function(r) { return r.team_id === teamId; }))
        liveItems.push({ game: g, gd: e.gd });
    });
  });
  if (liveItems.length) {
    els.live.innerHTML = '<div class="section-title">🔴 Live jetzt</div>'
      + liveItems.map(function(x) { return renderLiveBanner(x.game, x.gd, teamId, cfg.liveUrl); }).join('');
    startSpielplanPolling(liveItems.map(function(x) { return x.game.id; }));
  } else {
    els.live.innerHTML = '';
  }

  // Today's finished games — rendered in past section with score
  var todayFinishedByGd = {};
  activeEntries.forEach(function(e) {
    if (e.gd.date !== today) return;
    var split = splitTodayGames(e.games, teamId);
    if (split.finished.length) {
      todayFinishedByGd[e.gd.id] = { gd: e.gd, games: split.finished };
    }
  });

  // Past section — re-render if a gameday promoted from active OR today has finished games
  var hasTodayFinished = Object.keys(todayFinishedByGd).length > 0;
  if (els.past && (pastChanged || hasTodayFinished)) {
    var pastSorted = cache.past.slice().sort(function(a,b) { return b.gd.date.localeCompare(a.gd.date); });
    _pastCache[teamId] = pastSorted;
    var todayFinishedHtml = Object.keys(todayFinishedByGd).map(function(gdId) {
      var entry = todayFinishedByGd[gdId];
      return renderGamedayCard(entry.gd, entry.games, teamId, true);
    }).join('');
    var pastBody = pastSorted.length
      ? renderPastSection(pastSorted, teamId, cfg.past)
      : '<div class="no-data">Keine vergangenen Spieltage gefunden.</div>';
    els.past.innerHTML = todayFinishedHtml + pastBody;
  }

  // Future/active section — only re-render if scores/status changed vs. snapshot
  if (els.future) {
    var futureEntries = activeEntries
      .filter(function(e) { return classifyGameday(e.gd, e.games, teamId, today) === 'active'; })
      .sort(function(a,b) { return a.gd.date.localeCompare(b.gd.date); })
      .map(function(e) {
        if (e.gd.date !== today) return e;
        // For today's gameday, only show upcoming games (not live or finished)
        var split = splitTodayGames(e.games, teamId);
        return { id: e.id, gd: e.gd, games: split.upcoming };
      })
      .filter(function(e) { return e.games.length > 0; });
    if (cfg.future > 0) futureEntries = futureEntries.slice(0, cfg.future);
    var futureChanged = !futureRenderedInPhase1 || futureEntries.some(function(e) {
      var snapGd = snap.gamedays.find(function(gd) { return gd.id === e.id; });
      return fingerprintGames(e.games) !== fingerprintGames(snapGd ? snapGd.games : []);
    });
    if (futureChanged) {
      _futureCache[teamId] = futureEntries;
      els.future.innerHTML = renderFutureSection(futureEntries, teamId, 0);
    }
  }
}

function renderFutureSection(entries, teamId, visibleExtras) {
  if (!entries.length) return '<div class="no-data">Keine kommenden Spieltage geplant.</div>';
  visibleExtras = visibleExtras || 0;
  var next      = entries[0];
  var extras    = entries.slice(1);
  var html      = '';
  if (extras.length) {
    var shown     = extras.slice(0, visibleExtras);
    var remaining = extras.length - visibleExtras;
    var shownHtml = shown.slice().reverse()
      .map(function(e) { return renderGamedayCard(e.gd, e.games, teamId, false); }).join('');
    var buttonHtml = remaining > 0
      ? '<button class="toggle-more-future" data-team="' + teamId + '" data-visible="' + visibleExtras + '">'
        + 'Nächste Spieltage (' + remaining + ')'
        + '</button>'
      : '';
    html = buttonHtml + shownHtml;
  }
  html += renderGamedayCard(next.gd, next.games, teamId, false);
  return html;
}

function renderPastSection(pastSorted, teamId, visibleCount) {
  if (!pastSorted.length) return '';
  var shown = pastSorted.slice(0, visibleCount);
  var remaining = pastSorted.length - visibleCount;
  var buttonHtml = remaining > 0
    ? '<button class="load-more" data-team="' + teamId + '" data-visible="' + visibleCount + '">'
      + 'Weitere laden (' + remaining + ')'
      + '</button>'
    : '';
  var html = shown.map(function(e) { return renderGamedayCard(e.gd, e.games, teamId, true); }).join('');
  return html + buttonHtml;
}

// ── VIEW RENDERERS ───────────────────────────────────────────────────────────

function startSpielplanPolling(newGameIds) {
  newGameIds.forEach(function(id) { _spielplanLiveIds.add(id); });
  if (_spielplanPollInterval) return;

  function poll() {
    fetchJSON(LIVETICKER_API).then(function(data) {
      data.forEach(function(game) {
        if (!_spielplanLiveIds.has(game.gameId)) return;
        var el = document.getElementById('sp-live-score-' + game.gameId);
        if (el) el.textContent = game.home.score + ' : ' + game.away.score;
        if (game.status === 'Beendet') _spielplanLiveIds.delete(game.gameId);
      });
      if (_spielplanLiveIds.size === 0) {
        clearInterval(_spielplanPollInterval);
        _spielplanPollInterval = null;
      }
    }).catch(function() { /* silent — retry next tick */ });
  }

  _spielplanPollInterval = setInterval(poll, 30000);
}

function finishGame(gs) {
  var el = document.getElementById('lt-game-' + gs.gameId);
  if (el) el.parentNode.removeChild(el);
  _watchedGameIds.delete(gs.gameId);
  delete _liveGames[gs.gameId];
  if (Object.keys(_liveGames).length === 0 && _liveInterval) {
    clearInterval(_liveInterval);
    _liveInterval = null;
  }
}

function startLivePolling() {
  _liveFailCount = 0;

  function poll() {
    fetchJSON(LIVETICKER_API).then(function(data) {
      _liveFailCount = 0;
      var errEl = document.getElementById('lt-error-banner');
      if (errEl) errEl.parentNode.removeChild(errEl);

      // Update known live games
      data.forEach(function(game) {
        if (!_watchedGameIds.has(game.gameId)) return;
        var gs = _liveGames[game.gameId];
        if (!gs) return;

        // Accumulate new ticks (API newest-first; process oldest-first)
        var newTicks = [];
        game.ticks.slice().reverse().forEach(function(tick) {
          var fp = tick.text + '|' + tick.time;
          if (!gs.seenFingerprints.has(fp)) {
            gs.seenFingerprints.add(fp);
            gs.ticks.push(tick);  // maintain oldest-first order in state
            newTicks.push(tick);
          }
        });

        // Score / status / possession update
        var newScore    = { home: game.home.score, away: game.away.score };
        var scoreChanged = newScore.home !== gs.score.home || newScore.away !== gs.score.away;
        gs.score     = newScore;
        gs.status    = game.status;
        gs.possession = game.home.isInPossession ? 'home'
                      : (game.away.isInPossession ? 'away' : null);

        // DOM: flash score on change
        if (scoreChanged) {
          var scoreEl = document.getElementById('lt-score-' + gs.gameId);
          if (scoreEl) {
            var ourScore = gs.watchedSide === 'home' ? newScore.home : newScore.away;
            var oppScore = gs.watchedSide === 'home' ? newScore.away : newScore.home;
            scoreEl.textContent = (ourScore != null && oppScore != null)
              ? ourScore + ' : ' + oppScore : '– : –';
            scoreEl.classList.remove('lt-flash');
            void scoreEl.offsetWidth;   // force reflow so animation restarts
            scoreEl.classList.add('lt-flash');
          }
        }

        // DOM: update tick list
        if (newTicks.length) {
          var bodyEl = document.getElementById('lt-body-' + gs.gameId);
          if (bodyEl) bodyEl.innerHTML = buildTickRows(gs);
        }

        // Check if game is finished — by API status or "Spiel beendet" tick
        var isOver = game.status === 'Beendet'
          || gs.ticks.some(function(t) { return t.team == null && t.text === 'Spiel beendet'; });
        if (isOver) finishGame(gs);
      });

      // Detect new live games that started after page load
      data.forEach(function(game) {
        if (!_watchedGameIds.has(game.gameId) || _liveGames[game.gameId]) return;
        fetchJSON(LIVETICKER_API + '?getAllTicksFor=' + game.gameId).then(function(fullData) {
          var fullGame = fullData.find(function(g) { return g.gameId === game.gameId; });
          if (!fullGame) return;
          var watchedSide = _liveTeamNames[fullGame.home.name] ? 'home' : 'away';
          var newGs = {
            gameId: game.gameId,
            homeName: fullGame.home.name,
            awayName: fullGame.away.name,
            watchedSide: watchedSide,
            score: { home: fullGame.home.score, away: fullGame.away.score },
            status: fullGame.status,
            possession: fullGame.home.isInPossession ? 'home'
                      : (fullGame.away.isInPossession ? 'away' : null),
            ticks: fullGame.ticks.slice().reverse(),
            seenFingerprints: new Set(
              fullGame.ticks.map(function(t) { return t.text + '|' + t.time; })
            ),
            hasFullHistory: true
          };
          _liveGames[game.gameId] = newGs;
          var root = document.getElementById('root');
          if (root) {
            var wrapper = document.createElement('div');
            wrapper.innerHTML = renderLiveGameB3(newGs);
            root.insertBefore(wrapper.firstChild, root.firstChild);
          }
        }).catch(function() {});
      });

    }).catch(function() {
      _liveFailCount++;
      if (_liveFailCount >= 3) {
        var root = document.getElementById('root');
        if (root && !document.getElementById('lt-error-banner')) {
          var errDiv = document.createElement('div');
          errDiv.id        = 'lt-error-banner';
          errDiv.className = 'lt-conn-error';
          errDiv.textContent = '⚠ Verbindung unterbrochen';
          root.insertBefore(errDiv, root.firstChild);
        }
      }
    });
  }

  poll(); // immediate first call
  _liveInterval = setInterval(poll, 5000);
}

async function renderLiveView(root, cfg) {
  // Reset any existing global live state
  _liveGames     = {};
  if (_liveInterval) { clearInterval(_liveInterval); _liveInterval = null; }

  root.innerHTML = '<div class="lt-empty">Kein Live-Spiel gerade.</div>';

  DataStore.subscribe('ticks-update', function(data) {
    var gameId   = data.gameId;
    var newTicks = data.newTicks;

    var cardEl = document.getElementById('lt-game-' + gameId);
    if (!cardEl) {
      // First tick for this game: build game state and render card
      var snap = DataStore.snapshot;
      var snapGame = null;
      if (snap) {
        snap.gamedays.forEach(function(gd) {
          (gd.games || []).forEach(function(g) { if (g.id === gameId) snapGame = g; });
        });
      }
      if (!snapGame) return;

      var homeRes = snapGame.results.find(function(r) { return r.isHome; })  || {};
      var awayRes = snapGame.results.find(function(r) { return !r.isHome; }) || {};

      var watchedSide = cfg.teams.some(function(tid) { return tid === homeRes.team_id; }) ? 'home' : 'away';

      var gs = {
        gameId:       gameId,
        homeName:     homeRes.team_name || '',
        awayName:     awayRes.team_name || '',
        homeLogo:     TEAM_LOGOS[homeRes.team_id] || '',
        awayLogo:     TEAM_LOGOS[awayRes.team_id] || '',
        watchedSide:  watchedSide,
        score:        { home: null, away: null },
        status:       '',
        possession:   null,
        ticks:        DataStore.ticks[gameId] || [],
        hasFullHistory: false,
      };
      _liveGames[gameId] = gs;

      // Remove empty state if present
      var emptyEl = root.querySelector('.lt-empty');
      if (emptyEl) root.removeChild(emptyEl);

      var wrapper = document.createElement('div');
      wrapper.innerHTML = renderLiveGameB3(gs);
      root.insertBefore(wrapper.firstChild, root.firstChild);
    } else {
      // Subsequent ticks: prepend new tick rows
      var gs = _liveGames[gameId];
      if (!gs) return;
      gs.ticks = DataStore.ticks[gameId] || [];
      var ticksEl = document.getElementById('lt-body-' + gameId);
      if (ticksEl) {
        var newRows = newTicks.map(function(tick) {
          var tmpGs = Object.assign({}, gs, { ticks: [tick], hasFullHistory: false });
          return buildTickRows(tmpGs);
        }).join('');
        // safe — buildTickRows uses escapeHtml internally
        ticksEl.insertAdjacentHTML('afterbegin', newRows);
      }
    }
  });

  DataStore.subscribe('game-finished', function(data) {
    var el = document.getElementById('lt-game-' + data.gameId);
    if (el) el.parentNode && el.parentNode.removeChild(el);
    delete _liveGames[data.gameId];
    if (Object.keys(_liveGames).length === 0) {
      root.innerHTML = '<div class="lt-empty">Kein Live-Spiel gerade.</div>';
    }
  });

  try {
    await DataStore.init(cfg);
  } catch(e) {
    root.innerHTML = '<div class="error-banner">Fehler beim Laden.</div>';
  }
}

async function renderSpielplan(root, cfg) {
  // Build team DOM blocks
  var elMap = {};
  cfg.teams.forEach(function(teamId) {
    var block = document.createElement('div');
    block.className = 'team-block';
    block.innerHTML =
      (cfg.showTitle ? '<div class="team-title" id="t-title-' + teamId + '"></div>' : '')
      + (cfg.showFuture
          ? '<div id="t-future-' + teamId + '"><div class="loading">Lade Daten…</div></div>'
          : '')
      + (cfg.showPast
          ? '<div id="t-past-' + teamId + '"><div class="loading">Lade Daten…</div></div>'
          : '');
    root.appendChild(block);
    elMap[teamId] = {
      title:  document.getElementById('t-title-'  + teamId),
      past:   document.getElementById('t-past-'   + teamId),
      future: document.getElementById('t-future-' + teamId),
    };
  });

  // Subscribe to snapshot, then render
  DataStore.subscribe('snapshot-loaded', function(snap) {
    var today = new Date().toISOString().slice(0, 10);
    cfg.teams.forEach(function(teamId) {
      var els = elMap[teamId];
      var forTeam = snap.gamedays.filter(function(gd) {
        return gd.games && gd.games.some(function(g) {
          return g.results.some(function(r) { return r.team_id === teamId; });
        });
      });
      var past = forTeam
        .filter(function(gd) { return classifyGameday(gd, gd.games, teamId, today) === 'past'; })
        .sort(function(a, b) { return b.date.localeCompare(a.date); })
        .map(function(gd) { return { id: gd.id, gd: gd, games: gd.games }; });
      var future = forTeam
        .filter(function(gd) { return classifyGameday(gd, gd.games, teamId, today) !== 'past'; })
        .sort(function(a, b) { return a.date.localeCompare(b.date); })
        .map(function(gd) { return { id: gd.id, gd: gd, games: gd.games }; });
      var cappedFuture = (cfg.future > 0) ? future.slice(0, cfg.future) : future;

      var snapTeam = snap.teams.find(function(t) { return t.id === teamId; });
      if (els.title && snapTeam) els.title.textContent = snapTeam.name;
      if (els.past)   els.past.innerHTML   = renderPastSection(past, teamId, cfg.past);
      if (els.future) els.future.innerHTML = renderFutureSection(cappedFuture, teamId, 0);
    });
  });

  // Subscribe to live score updates
  DataStore.subscribe('game-score-update', function(data) {
    var el = document.getElementById('score-' + data.gameId);
    if (!el) return;
    el.textContent = data.homeScore + ' : ' + data.awayScore;
  });

  DataStore.subscribe('game-finished', function(data) {
    var el = document.getElementById('score-' + data.gameId);
    if (el) el.classList.add('score-final');
  });

  // Click delegation — "Weitere laden" and future toggle
  root.addEventListener('click', function(e) {
    var snap = DataStore.snapshot;
    if (!snap) return;
    var today = new Date().toISOString().slice(0, 10);

    var btn = e.target.closest('.load-more');
    if (btn) {
      var teamId     = parseInt(btn.getAttribute('data-team'), 10);
      var newVisible = parseInt(btn.getAttribute('data-visible'), 10) + 3;
      var pastEl     = document.getElementById('t-past-' + teamId);
      if (!pastEl) return;
      var past = snap.gamedays
        .filter(function(gd) {
          return gd.games && gd.games.some(function(g) {
            return g.results.some(function(r) { return r.team_id === teamId; });
          }) && classifyGameday(gd, gd.games, teamId, today) === 'past';
        })
        .sort(function(a, b) { return b.date.localeCompare(a.date); })
        .map(function(gd) { return { id: gd.id, gd: gd, games: gd.games }; });
      pastEl.innerHTML = renderPastSection(past, teamId, newVisible);
      return;
    }

    var fBtn = e.target.closest('.toggle-more-future');
    if (fBtn) {
      var teamId     = parseInt(fBtn.getAttribute('data-team'), 10);
      var newVisible = parseInt(fBtn.getAttribute('data-visible'), 10) + 3;
      var futureEl   = document.getElementById('t-future-' + teamId);
      if (!futureEl) return;
      var future = snap.gamedays
        .filter(function(gd) {
          return gd.games && gd.games.some(function(g) {
            return g.results.some(function(r) { return r.team_id === teamId; });
          }) && classifyGameday(gd, gd.games, teamId, today) !== 'past';
        })
        .sort(function(a, b) { return a.date.localeCompare(b.date); })
        .map(function(gd) { return { id: gd.id, gd: gd, games: gd.games }; });
      var cappedFuture = (cfg.future > 0) ? future.slice(0, cfg.future) : future;
      futureEl.innerHTML = renderFutureSection(cappedFuture, teamId, newVisible);
    }
  });

  try {
    await DataStore.init(cfg);
  } catch(err) {
    cfg.teams.forEach(function(teamId) {
      var els = elMap[teamId];
      var errBanner = '<div class="error-banner">Fehler beim Laden: ' + escapeHtml(err.message) + '</div>';
      if (els.future) els.future.innerHTML = errBanner;
      if (els.past)   els.past.innerHTML   = errBanner;
    });
  }
}

function renderStandingsTable(entry, teamIds, liveTeamIds) {
  liveTeamIds = liveTeamIds || new Set();
  if (!entry.rows || entry.rows.length === 0) {
    return '<div class="standings-empty">Keine Tabellendaten verfügbar.</div>';
  }
  var thead = '<thead><tr>'
    + '<th class="col-rank">Pl.</th>'
    + '<th class="col-team">Mannschaft</th>'
    + '<th>Sp</th><th>S</th><th>U</th><th>N</th>'
    + '<th>EP</th><th>GP</th><th>PD</th><th>SQ</th>'
    + '</tr></thead>';
  var restricted = entry.promotion_restricted || [];
  var rows = entry.rows.map(function(row, i) {
    var cls = '';
    if (teamIds.indexOf(row.team_id) >= 0) cls += ' standings-row-highlight';
    if (restricted.indexOf(row.team_id) >= 0) cls += ' standings-row-restricted';
    var liveBadge = liveTeamIds.has(row.team_id)
      ? '<span class="standings-live-badge">⚡</span>' : '';
    return '<tr id="row-' + row.team_id + '" class="' + cls.trim() + '">'
      + '<td class="col-rank">' + (i + 1) + '.</td>'
      + '<td class="col-team">'
      + (TEAM_LOGOS[row.team_id] ? '<img src="' + TEAM_LOGOS[row.team_id] + '" class="team-logo" loading="lazy" onerror="this.style.display=\'none\'">' : '')
      + liveBadge + escapeHtml(row.team_name) + '</td>'
      + '<td>' + row.Sp + '</td>'
      + '<td>' + row.S  + '</td>'
      + '<td>' + row.U  + '</td>'
      + '<td>' + row.N  + '</td>'
      + '<td>' + row.EP + '</td>'
      + '<td>' + row.GP + '</td>'
      + '<td>' + row.PD + '</td>'
      + '<td>' + row.SQ.toFixed(4) + '</td>'
      + '</tr>';
  }).join('');
  return '<table class="standings-table">' + thead + '<tbody>' + rows + '</tbody></table>';
}

// Module-level state for year switching (set by renderTableView)
var _standingsAllEntries = [];
var _standingsTeams = [];
var _standingsRoot = null;

function _renderStandingsForYear(allEntries, year, teams) {
  var entries = allEntries.filter(function(e) { return e.year === year; });
  var teamEntries = entries.filter(function(e) {
    return e.entry.rows.some(function(r) { return teams.indexOf(r.team_id) >= 0; });
  });
  var toRender = teamEntries.length > 0 ? teamEntries : entries;
  var html = '';
  toRender.forEach(function(e) {
    html += '<div class="standings-league-title">' + escapeHtml(e.entry.name) + '</div>';
    html += renderStandingsTable(e.entry, teams);
  });
  return html || '<div class="standings-empty">Keine Tabellendaten für ' + escapeHtml(String(year)) + '.</div>';
}

function _groupLeaguesFromSnapshot(snap, teamIds) {
  var leagueMap = {};
  (snap.gamedays || []).forEach(function(gd) {
    var teamPlays = gd.games && gd.games.some(function(g) {
      return g.results.some(function(r) { return teamIds.indexOf(r.team_id) >= 0; });
    });
    if (!teamPlays) return;
    var key = (gd.league_display || 'Unbekannt');
    if (!leagueMap[key]) leagueMap[key] = [];
    leagueMap[key].push(gd);
  });
  return Object.keys(leagueMap).sort().map(function(league) {
    return { league: league, gamedays: leagueMap[league] };
  });
}

function _applyLiveScore(row, liveScore, isHome) {
  var myScore  = isHome ? liveScore.homeScore : liveScore.awayScore;
  var oppScore = isHome ? liveScore.awayScore : liveScore.homeScore;
  var won  = myScore > oppScore;
  var drew = myScore === oppScore;
  var newSp = row.Sp + 1;
  var newS  = row.S  + (won  ? 1 : 0);
  var newU  = row.U  + (drew ? 1 : 0);
  var newN  = row.N  + (!won && !drew ? 1 : 0);
  var newEP = row.EP + myScore;
  var newGP = row.GP + oppScore;
  var sq    = newSp > 0 ? parseFloat(((2 * newS + newU) / (2 * newSp)).toFixed(4)) : 0;
  return Object.assign({}, row, { Sp: newSp, S: newS, U: newU, N: newN, EP: newEP, GP: newGP, SQ: sq });
}

async function renderTableView(root, cfg) {
  root.innerHTML = '<div class="loading">Lade Tabelle…</div>';

  DataStore.subscribe('snapshot-loaded', function(snap) {
    _renderTableFromSnap(root, snap, cfg.teams);
  });

  DataStore.subscribe('game-score-update', function(data) {
    var snap = DataStore.snapshot;
    if (!snap) return;

    // Find which teams are in this game and whether they are home or away
    var gameTeams = [];  // [{ team_id, isHome }]
    snap.gamedays.forEach(function(gd) {
      (gd.games || []).forEach(function(g) {
        if (g.id !== data.gameId) return;
        (g.results || []).forEach(function(r) {
          gameTeams.push({ team_id: r.team_id, isHome: r.isHome });
        });
      });
    });

    gameTeams.forEach(function(teamInfo) {
      var rowEl = document.getElementById('row-' + teamInfo.team_id);
      if (!rowEl) return;

      // Add live class + badge if not already there
      rowEl.classList.add('standings-row-live');
      if (!rowEl.querySelector('.standings-live-badge')) {
        var td = rowEl.querySelector('.col-team');
        if (td) {
          // safe — hardcoded literal, not user data
          td.insertAdjacentHTML('afterbegin', '<span class="standings-live-badge">⚡</span>');
        }
      }

      // Find base row stats from snap.standings
      var baseRow = null;
      if (snap.standings) {
        Object.keys(snap.standings).forEach(function(slug) {
          Object.keys(snap.standings[slug]).forEach(function(year) {
            var entry = snap.standings[slug][year];
            (entry.rows || []).forEach(function(r) {
              if (r.team_id === teamInfo.team_id && !baseRow) baseRow = r;
            });
          });
        });
      }
      if (!baseRow) return;

      // Compute live-adjusted stats
      var liveScore = { homeScore: data.homeScore, awayScore: data.awayScore };
      var updatedRow = _applyLiveScore(baseRow, liveScore, teamInfo.isHome);

      // Update stat cells by column index: rank(0), team(1), Sp(2), S(3), U(4), N(5), EP(6), GP(7), PD(8), SQ(9)
      var cells = rowEl.querySelectorAll('td');
      if (cells.length >= 10) {
        cells[2].textContent = updatedRow.Sp;
        cells[3].textContent = updatedRow.S;
        cells[4].textContent = updatedRow.U;
        cells[5].textContent = updatedRow.N;
        cells[6].textContent = updatedRow.EP;
        cells[7].textContent = updatedRow.GP;
        cells[8].textContent = updatedRow.EP - updatedRow.GP;  // PD
        cells[9].textContent = updatedRow.SQ.toFixed(4);
      }
    });
  });

  DataStore.subscribe('game-finished', function(data) {
    var snap = DataStore.snapshot;
    if (!snap) return;
    snap.gamedays.forEach(function(gd) {
      (gd.games || []).forEach(function(g) {
        if (g.id !== data.gameId) return;
        g.results.forEach(function(r) {
          var rowEl = document.getElementById('row-' + r.team_id);
          if (!rowEl) return;
          rowEl.classList.remove('standings-row-live');
          var badge = rowEl.querySelector('.standings-live-badge');
          if (badge) badge.parentNode.removeChild(badge);
        });
      });
    });
  });

  try {
    await DataStore.init(cfg);
  } catch(e) {
    root.innerHTML = '<div class="error-banner">Fehler beim Laden der Tabelle.</div>';
  }
}

function _renderTableFromSnap(root, snap, teamIds) {
  var leagues = _groupLeaguesFromSnapshot(snap, teamIds);
  if (leagues.length === 0) {
    root.innerHTML = '<div class="no-data">Keine Tabellendaten verfügbar.</div>';
    return;
  }
  var html = '<div class="standings-wrapper">';
  leagues.forEach(function(lg) {
    html += '<div class="standings-league-title">' + escapeHtml(lg.league) + '</div>';
    // Find precomputed standings entry for this league
    var entry = null;
    if (snap.standings) {
      var phase = null;
      lg.gamedays.forEach(function(gd) { if (gd.phase && !phase) phase = gd.phase; });
      if (phase) {
        Object.keys(snap.standings).forEach(function(slug) {
          Object.keys(snap.standings[slug]).forEach(function(year) {
            var e = snap.standings[slug][year];
            if (e.name === phase && !entry) entry = e;
          });
        });
      }
    }
    if (entry) {
      html += renderStandingsTable(entry, teamIds, new Set());
    }
    // Upcoming fixtures below table
    var upcoming = lg.gamedays.filter(function(gd) {
      return (gd.games || []).some(function(g) { return g.final_score === null; });
    });
    if (upcoming.length > 0) {
      html += '<div class="standings-league-title" style="font-size:0.75rem;margin-top:12px;">Ausstehende Spiele</div>';
      upcoming.forEach(function(gd) {
        html += '<div class="gameday-upcoming">'
          + escapeHtml(formatDate(gd.date)) + ' — ' + escapeHtml(gd.name) + '</div>';
      });
    }
  });
  html += '</div>';
  root.innerHTML = html;
}

// ── INIT ─────────────────────────────────────────────────────────────────────
(async function() {
  var cfg = parseConfig();
  document.documentElement.style.setProperty('--accent', '#' + cfg.color);
  if (cfg.compact) document.body.classList.add('compact');

  if (cfg.teams.length === 0) {
    document.getElementById('root').innerHTML =
      '<div class="error-banner">Kein Team konfiguriert. Bitte ?t=&lt;team_id&gt; in der URL angeben.</div>';
    return;
  }

  var root = document.getElementById('root');

  if (cfg.view === 'live') {
    await renderLiveView(root, cfg);
  } else if (cfg.view === 'table') {
    await renderTableView(root, cfg);
  } else {
    await renderSpielplan(root, cfg);
  }
})();

function reportHeight() {
  window.parent.postMessage(
    { type: 'iframeHeight', height: document.body.getBoundingClientRect().height },
    '*'
  );
}
var _reportHeightTimer;
new ResizeObserver(function() {
  clearTimeout(_reportHeightTimer);
  _reportHeightTimer = setTimeout(reportHeight, 50);
}).observe(document.body);
</script>
